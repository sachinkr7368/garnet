[package]
name = "garnet"
version = "0.1.0"
description = "A fast Ruby and Rails IDE"
authors = ["Sachin"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "garnet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["process", "io-util", "rt", "macros", "time", "net", "sync"] }
portable-pty = "=0.9.0"
ignore = "=0.4.34"
grep-searcher = "=0.1.17"
grep-regex = "=0.1.14"
grep-matcher = "=0.1.9"
notify = "=8.2.1"
nucleo-matcher = "=0.3.1"
libc = "0.2"
futures-util = { version = "=0.3.34", default-features = false }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }
postgres-native-tls = "=0.5.3"
native-tls = "=0.2.18"
mysql_async = { version = "=0.37.1", default-features = false, features = ["minimal-rust", "native-tls-tls"] }
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
serde_yaml = "=0.9.34"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "json", "form", "system-proxy", "charset"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "=0.23.1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"

[dev-dependencies]
mockito = "=1.7.0"

[profile.release]
codegen-units = 4
lto = "thin"
strip = true
